<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <title>id 속성 연습</title>
    <style>
      /* CSS: id가 container인 부모에게 flex 지시 */
      #container {
        display: flex;
        justify-content: center;
        gap: 12px;
      }
    </style>
  </head>
  <body>
    <!-- HTML: 박스 3개를 감싸는 부모 -->
    <div id="container">
      <div>박스1</div>
      <div>박스2</div>
      <div>박스3</div>
    </div>
  </body>
</html>
