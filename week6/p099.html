<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>CSS Property Basic</title>
    <style>
        div {
            /* 99쪽: width와 height 속성 */
            width: 100px; height: 100px;
            background-color: red;

            /* 100쪽: border, margin, padding 속성 추가 */
            border: 20px solid black;
            margin: 10px; padding: 30px;
        }
    </style>
</head>
<body>
    <div></div>
</body>
</html>
